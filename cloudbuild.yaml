# Cloud Build パイプライン: YOLO 学習 → Cloud Run デプロイ
#
# トリガー: pipeline/config.yaml の変更を main ブランチへ push
#
# 代入変数 (terraform/cloudbuild.tf の substitutions で自動設定される):
#   _PROJECT_ID     : GCP プロジェクト ID
#   _REGION         : リージョン (asia-northeast1)
#   _ENDPOINT_ID    : Cloud Run サービス名 (vtuber-detector)
#   _WANDB_API_KEY  : W&B API キー (省略可)
#   _WANDB_PROJECT  : W&B プロジェクト名 (デフォルト: vtuber-detector)

steps:
  # ── Trainer コンテナのビルド ───────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-trainer
    waitFor: ['-']
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/mlops/trainer:${BUILD_ID}
      - src/

  # ── Serving コンテナのビルド ───────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-serving
    waitFor: ['-']
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/mlops/serving:${BUILD_ID}
      - serve/

  # ── Trainer イメージを Artifact Registry にプッシュ ───────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-trainer
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/mlops/trainer:${BUILD_ID}
    waitFor: [build-trainer]

  # ── Serving イメージを Artifact Registry にプッシュ ───────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-serving
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/mlops/serving:${BUILD_ID}
    waitFor: [build-serving]

  # ── Vertex AI Pipelines へ投入してすぐ終了 ────────────────────────────
  # Cloud Build はパイプラインを submit したら即終了する (学習完了は待たない)
  # 以降の training → deploy は Vertex AI が非同期に管理する
  - name: python:3.11-slim
    id: submit-pipeline
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q google-cloud-aiplatform kfp pyyaml &&
        python -m pipeline.submit
    env:
      - PROJECT_ID=${_PROJECT_ID}
      - REGION=${_REGION}
      - DATA_BUCKET=${_PROJECT_ID}-mlops-data
      - PIPELINE_BUCKET=${_PROJECT_ID}-mlops-pipeline
      - TRAINER_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/mlops/trainer:${BUILD_ID}
      - SERVING_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/mlops/serving:${BUILD_ID}
      - ENDPOINT_ID=${_ENDPOINT_ID}
      - BUILD_ID=${BUILD_ID}
      - VERTEX_SA=mlops-vertex-ai@${_PROJECT_ID}.iam.gserviceaccount.com
      - WANDB_API_KEY=${_WANDB_API_KEY}
      - WANDB_PROJECT=${_WANDB_PROJECT}
    waitFor: [push-trainer, push-serving]

substitutions:
  _PROJECT_ID: mlops-489016
  _REGION: asia-northeast1
  _ENDPOINT_ID: vtuber-detector
  _WANDB_API_KEY: ""
  _WANDB_PROJECT: vtuber-detector

options:
  logging: CLOUD_LOGGING_ONLY
